repos:
  - repo: https://github.com/rtts/djhtml
    rev: 3.0.11
    hooks:
      - id: djhtml
        args:
          - "-t=2" # Tab indentation
      - id: djcss
      - id: djjs
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/hakancelikdev/unimport
    rev: 1.3.1
    hooks:
      - id: unimport
        args:
          - --include-star-import
          - --ignore-init
          - --gitignore

